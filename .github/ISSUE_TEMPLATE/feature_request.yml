name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve. Feature requests are reviewed for fit with Spellbook's scope as a table companion.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or limitation are you hitting?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Spellbook to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried

  - type: dropdown
    id: area
    attributes:
      label: Spellbook area
      options:
        - Characters
        - Spells / Powers
        - Play Mode
        - Table Mode
        - GM Mode
        - Admin / access
        - Multi-system support
        - Other
    validations:
      required: true
