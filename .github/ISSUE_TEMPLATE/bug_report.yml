name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Spellbook. Please do **not** include passwords, session tokens, or private table data.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the problem
      placeholder: e.g. Play Mode does not refresh assigned Effects after import
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Sign in and open Characters
        2. Select an active character
        3. Go to Play Mode
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Spellbook area
      options:
        - Sign-in / access
        - Characters
        - Spells / Powers
        - Play Mode
        - Table Mode
        - GM Mode
        - Admin
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Firefox 128 on macOS 14

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here, or paste links
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help
